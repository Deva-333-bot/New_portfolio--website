version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: portfolio_db
    restart: always
    environment:
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: secure_portfolio_password_2026
      POSTGRES_DB: portfolio_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d portfolio_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "False"
      DATABASE_URL: postgresql+psycopg2://portfolio_user:secure_portfolio_password_2026@db:5432/portfolio_db
      CANONICAL_SITE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:8000
      SESSION_SECRET: enterprise_random_64_character_session_secret_for_production
      PASSWORD_RESET_SECRET: enterprise_random_64_character_password_reset_secret
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ADMIN_BOOTSTRAP_EMAIL: admin@florante.tech
      ADMIN_BOOTSTRAP_PASSWORD: ProductionPassword2026!
      EMAIL_PROVIDER: console
      EMAIL_FROM_ADDRESS: hello@florante.tech
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  pgdata:
  backend_uploads:
